<style>
:root{--bg:#0d0f13;--s1:#161920;--s2:#1f232c;--s3:#2b303b;--tx:#eef0f5;--mu:#8b93a7;--ac:#3ddc97;--p:#5b9dff;--c:#f5b942;--f:#ef6fbf;--warn:#ff9f43;--bad:#ff5d5d;--cardio:#b98cff;--r:16px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}

header{position:sticky;top:0;z-index:5;background:rgba(13,15,19,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(var(--st) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
header h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em}
main{padding:0 14px calc(100px + var(--sb));max-width:640px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:rgba(22,25,32,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--s3);padding-bottom:var(--sb)}
nav.tabs button{flex:1;max-width:160px;background:none;border:0;color:var(--mu);padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12px/1 inherit;min-height:62px;cursor:pointer}

.card{background:var(--s1);border-radius:var(--r);padding:14px;margin:12px 0}
.card.inset{background:var(--s2);margin:8px 0}
.card.inset input,.card.inset select{background:var(--s1)}
.hero{border-left:5px solid var(--dc,var(--ac))}
.tip{border:1px dashed var(--s3)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grow{flex:1;min-width:0}.center{text-align:center}.right{text-align:right}
.mu{color:var(--mu)}.sm{font-size:14px}.xs{font-size:12.5px}
.mt{margin-top:14px}.mt8{margin-top:8px}.mt4{margin-top:4px}.pad{padding:16px 4px}
.h2{font-size:20px;font-weight:750;letter-spacing:-.01em}.h3{font-size:17px;font-weight:700}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}

.big{font-size:26px;font-weight:800;letter-spacing:-.02em}

.card .btn{background:var(--s3)}

.seg button.on,.tabs2 button.on{background:var(--s3);color:var(--tx)}

select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.warnTxt{color:var(--warn)}
details{margin-top:10px}summary{cursor:pointer;color:var(--mu);padding:6px 0}

.ring{position:relative;width:132px;height:132px;flex:none}

.mb{margin-top:12px}.bar{height:10px;background:var(--s2);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.datenav{display:flex;align-items:center;gap:10px;margin-top:4px}.datenav .grow{cursor:pointer}

.scanbox.native::after{content:"";position:absolute;left:10%;right:10%;top:32%;bottom:32%;border:3px solid var(--ac);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.3)}

#h5reader{width:100%}#h5reader video{object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{background:var(--s2);border-radius:14px;padding:10px 12px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mu)}
canvas.chart{width:100%;height:220px;display:block;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--mu);font-weight:700;padding:4px 0}
.calgrid .cd{aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--s2);cursor:pointer;position:relative;color:var(--mu)}
.calgrid .cd.has{background:var(--dc);color:#0b0d10;font-weight:800}
.calgrid .cd.today{outline:2px solid var(--tx)}
.calgrid .cd.sel{box-shadow:0 0 0 3px var(--ac)}
.calgrid .cd .cdot{position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--cardio)}
.calgrid .cd.has .cdot{background:#0b0d10}
.wkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.wkgrid div{background:var(--s2);border-radius:12px;padding:8px 10px}.wkgrid span{display:block;font-size:11.5px;color:var(--mu)}.wkgrid b{font-size:16px}.wkgrid small{font-size:12px;font-weight:600}
.ok{color:var(--ac)}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet-wrap.open{display:flex}
.sheet{background:var(--s1);width:100%;max-width:640px;max-height:93vh;max-height:93dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet.full{height:100%;max-height:none;border-radius:0;padding-top:var(--st)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{padding:8px 16px 6px;flex:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 8px}
.sheet.full .grab{display:none}
.sheet-head h2{margin:0;font-size:19px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + var(--sb));overscroll-behavior:contain}
.sheet .card{background:var(--s2)}
.sheet .card .btn,.sheet .card .iconbtn{background:var(--s3)}
.sheet .li{border-color:var(--s2)}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%) translateY(20px);background:#2f3542;color:var(--tx);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:50;opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>

<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;};
const r0=n=>Math.round(n),r1=n=>Math.round(n*10)/10,r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');
const ymd=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtD=(s,o={weekday:'short',day:'numeric',month:'short'})=>parseYmd(s).toLocaleDateString('en-GB',o);
const weekStart=s=>{const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
const fmtNum=n=>Math.round(n).toLocaleString('en-US');

/* ================= constants ================= */
const KEY='recomp_tracker_v1';
const EQUIP={
 db2:{label:'Dumbbells – weight per dumbbell (2 dumbbells)',short:'2 dumbbells',w:'per dumbbell',inc:2},
 db1:{label:'Single dumbbell (1 dumbbell)',short:'1 dumbbell',w:'one dumbbell',inc:2},
 bb:{label:'Barbell – total weight incl. bar',short:'Barbell',w:'total incl. bar',inc:2.5},
 cable:{label:'Cable – stack weight',short:'Cable',w:'stack',inc:2.5},
 machine:{label:'Machine – stack weight',short:'Machine',w:'stack',inc:5},
 bw:{label:'Bodyweight (+ added weight)',short:'Bodyweight',w:'added, 0 = BW',inc:2.5}
};
const MUSCLES=['Chest','Shoulders','Triceps','Back','Rear delts','Biceps','Forearms','Quads','Hamstrings','Glutes','Calves','Abs','Full body','Other'];
const DAY_COLORS=['#ff8a5b','#5b9dff','#3ddc97','#f5b942','#ef6fbf','#b98cff'];
// id,name,muscle,equip,day,sets,repMin,repMax,note,unit
const DEF_EX=[
 ['d1-bench','Barbell Bench Press','Chest','bb',1,'3–4',6,10],
 ['d1-incdb','Incline Dumbbell Press','Chest','db2',1,'3',8,12],
 ['d1-cross','Cable Crossover','Chest','cable',1,'3',10,15],
 ['d1-ohp','Seated Dumbbell Shoulder Press','Shoulders','db2',1,'3',8,12],
 ['d1-lat','Dumbbell Lateral Raise','Shoulders','db2',1,'3–4',12,15],
 ['d1-ohtri','Overhead Triceps Extension','Triceps','db1',1,'3',10,12],
 ['d1-rope','Triceps Rope Pushdown','Triceps','cable',1,'3',10,15],
 ['d2-pullup','Pull-Ups','Back','bw',2,'3–4',6,10,'or Lat Pulldown'],
 ['d2-pulldown','Lat Pulldown','Back','cable',2,'3–4',8,12,'or Pull-Ups'],
 ['d2-bbrow','Barbell Row','Back','bb',2,'3–4',6,10,'or Seated Cable Row'],
 ['d2-cablerow','Seated Cable Row','Back','cable',2,'3–4',8,12,'or Barbell Row'],
 ['d2-sarow','Single-Arm Dumbbell Row','Back','db1',2,'3',8,12],
 ['d2-face','Face Pulls','Rear delts','cable',2,'3',12,15],
 ['d2-rdf','Rear Delt Fly','Rear delts','db2',2,'3',12,15],
 ['d2-bbcurl','Barbell Curl','Biceps','bb',2,'3',8,12],
 ['d2-inccurl','Incline Dumbbell Curl','Biceps','db2',2,'3',10,12],
 ['d2-hammer','Hammer Curl','Biceps','db2',2,'3',10,12],
 ['d3-squat','Barbell Back Squat','Quads','bb',3,'3–4',6,10],
 ['d3-rdl','Romanian Deadlift','Hamstrings','bb',3,'3',8,10],
 ['d3-legpress','Leg Press','Quads','machine',3,'3',10,12],
 ['d3-legcurl','Leg Curl','Hamstrings','machine',3,'3',10,15],
 ['d3-legext','Leg Extension','Quads','machine',3,'3',10,15],
 ['d3-calf','Standing Calf Raise','Calves','machine',3,'3–4',10,15],
 ['d3-hlr','Hanging Leg Raise','Abs','bw',3,'3',10,15],
 ['d3-crunch','Cable Crunch','Abs','cable',3,'3',12,15],
 ['d3-plank','Plank','Abs','bw',3,'3',30,60,'','sec']
];
const CARDIO=['treadmill','bike','stairmaster','rowing','walking','running'];

const LB=2.20462;
const U=()=>D.settings.unit;

/* ================= workout helpers ================= */
const exById=id=>D.exercises.find(e=>e.id===id);
const eqOf=ex=>EQUIP[ex&&ex.equip]||EQUIP.bb;
const setsOn=d=>D.sets.filter(s=>s.date===d).sort((a,b)=>a.ts-b.ts);
const cardioOn=d=>D.cardio.filter(c=>c.date===d).sort((a,b)=>a.ts-b.ts);
function groupsOn(d){const m=new Map();for(const s of setsOn(d)){if(!m.has(s.exId))m.set(s.exId,[]);m.get(s.exId).push(s);}
 return[...m].map(([id,sets])=>({ex:exById(id)||{id,name:'(deleted exercise)',equip:'bb',unit:'reps',muscle:''},sets}));}
const workoutDates=()=>[...new Set([...D.sets.map(s=>s.date),...D.cardio.map(c=>c.date)])].sort();
function dayOf(d){const ids=new Set(D.sets.filter(s=>s.date===d).map(s=>s.exId));if(!ids.size)return null;let best=null,bn=0;
 for(const day of D.split){const n=day.exIds.filter(i=>ids.has(i)).length;if(n>bn){bn=n;best=day;}}return best;}
function nextDay(before){const dates=[...new Set(D.sets.map(s=>s.date))].filter(x=>x<before).sort();
 for(let i=dates.length-1;i>=0;i--){const d=dayOf(dates[i]);if(d){const k=D.split.indexOf(d);return D.split[(k+1)%D.split.length];}}return D.split[0]||null;}
function lastPerf(exId,before){let best=null;for(const s of D.sets)if(s.exId===exId&&s.date<before&&(!best||s.date>best))best=s.date;
 if(!best)return null;return{date:best,sets:D.sets.filter(s=>s.exId===exId&&s.date===best).sort((a,b)=>a.ts-b.ts)};}
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
const topSet=sets=>sets.reduce((a,s)=>!a||s.weight>a.weight||(s.weight===a.weight&&s.reps>a.reps)?s:a,null);
function curBW(date){const w=D.body.filter(b=>b.weight).sort((a,b)=>a.date<b.date?-1:1);const before=date?w.filter(b=>b.date<=date):w;
 if(before.length)return before[before.length-1].weight;if(w.length)return w[w.length-1].weight;return D.settings.startWeight||71;}
const score=(ex,s)=>ex.unit==='sec'?s.reps:e1rm(s.weight+(ex.equip==='bw'?curBW(s.date):0),s.reps);
function wtxt(ex,kg){return ex.equip==='bw'?(kg>0?`BW + ${fmtW(kg)} ${U()}`:'Bodyweight'):`${fmtW(kg)} ${U()}`;}
function fmtSet(ex,s,full){const sec=ex.unit==='sec';let w;
 if(ex.equip==='bw')w=s.weight>0?`BW+${fmtW(s.weight)}`:'BW';else w=fmtW(s.weight)+(full?' '+U():'');
 if(sec)return(ex.equip==='bw'&&!(s.weight>0))?`${s.reps} s`:`${w} · ${s.reps} s`;return`${w} × ${s.reps}`;}
function hint(ex,lp){const sec=ex.unit==='sec';
 if(!lp)return sec?`Hold ${ex.repMin}–${ex.repMax} s with good form.`:`First time: pick a weight you can do for ${ex.repMin}–${ex.repMax} clean reps.`;
 const t=topSet(lp.sets),eq=eqOf(ex),incU=U()==='lb'?eq.inc*2:eq.inc,incKg=fromU(incU);
 if(sec)return t.reps>=ex.repMax?`You held ${t.reps} s – try ${t.reps+10} s or add weight.`:`Try <b>${Math.min(ex.repMax,t.reps+5)} s</b> (+5 s).`;
 if(t.reps<ex.repMax)return`Try <b>${wtxt(ex,t.weight)} × ${t.reps+1}</b> (+1 rep)<div class="xs mu mt4">or ${wtxt(ex,t.weight+incKg)} × ${t.reps} (+${incU} ${U()}) if it felt easy</div>`;
 return`You hit ${ex.repMax} reps – try <b>${wtxt(ex,t.weight+incKg)} × ${ex.repMin}+</b> (+${incU} ${U()})`;}

/* ================= nutrition helpers ================= */
function defMeal(){const h=new Date().getHours();return h<11?'breakfast':h<15?'lunch':h<17?'snacks':h<22?'dinner':'snacks';}
const fac=(it,a)=>it.unit==='portion'?a:a/100;
function entTot(e){const f=fac(e.item,e.amount),n=e.item.n;return{kcal:(n.kcal||0)*f,p:(n.p||0)*f,c:(n.c||0)*f,f:(n.f||0)*f};}
function sumT(arr){return arr.reduce((a,e)=>{const t=entTot(e);a.kcal+=t.kcal;a.p+=t.p;a.c+=t.c;a.f+=t.f;return a;},{kcal:0,p:0,c:0,f:0});}
const dayFood=d=>D.foods.filter(f=>f.date===d);
const amtTxt=(it,a)=>it.unit==='portion'?`${r2(a)} × portion`:`${r1(a)} g`;
const isFav=k=>D.favs.some(x=>x.key===k);
const cardioKcal=(t,i,min,kg)=>Math.round((MET[t]||MET.walking)[Math.max(0,INTS.indexOf(i))]*kg*(min||0)/60);

/* ================= Open Food Facts ================= */
const OFF_FIELDS='code,product_name,product_name_de,product_name_sk,product_name_cs,product_name_en,generic_name,brands,nutriments,quantity,product_quantity,product_quantity_unit,serving_size,serving_quantity';
async function fetchJSON(url,ms=15000){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms);
 try{const r=await fetch(url,{signal:ac.signal});if(!r.ok&&r.status!==404)throw new Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(t);}}
function parseOFF(p,code){const nm=p.nutriments||{};const g=k=>num(nm[k]);
 let kcal=g('energy-kcal_100g');if(kcal==null&&g('energy_100g')!=null)kcal=g('energy_100g')/4.184;
 const name=(p.product_name||p.product_name_de||p.product_name_sk||p.product_name_cs||p.product_name_en||p.generic_name||'').trim()||'Unknown product';
 let pkg=num(p.product_quantity);const pu=(p.product_quantity_unit||'g').toLowerCase();if(pkg!=null&&pu==='kg')pkg*=1000;if(pkg!=null&&pu==='l')pkg*=1000;if(pkg!=null&&!['g','ml','kg','l'].includes(pu))pkg=null;
 const serving=num(p.serving_quantity);
 return{key:'off:'+code,code:String(code||''),name,brand:(p.brands||'').split(',')[0].trim(),unit:'g',
  n:{kcal:r1(kcal||0),p:r1(g('proteins_100g')||0),c:r1(g('carbohydrates_100g')||0),f:r1(g('fat_100g')||0)},
  pkg:pkg>0?pkg:null,serving:serving>0?serving:null,qtyText:p.quantity||'',missing:kcal==null};}
async function offProduct(code){const j=await fetchJSON(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
 if(!j||j.status!==1||!j.product)return null;return parseOFF(j.product,code);}
async function offSearch(q){const j=await fetchJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&fields=${OFF_FIELDS}`,20000);
 return(j.products||[]).filter(p=>p.code).map(p=>parseOFF(p,p.code)).filter(x=>!x.missing&&x.name!=='Unknown product');}
function findLocal(code){for(const arr of[D.myFoods,D.favs,D.recent]){const f=arr.find(x=>x.code&&x.code===code);if(f)return f;}return null;}
function localPool(){const m=new Map();for(const arr of[D.favs,D.myFoods,D.recent])for(const x of arr)if(!m.has(x.key))m.set(x.key,x);return[...m.values()];}
function localMatches(q){const w=q.toLowerCase().split(/\s+/).filter(Boolean);return localPool().filter(x=>{const s=(x.name+' '+x.brand).toLowerCase();return w.every(t=>s.includes(t));}).slice(0,10);}

const stack=[];
function showSheet(render,opts={}){stack.push({render,...opts});history.pushState({s:stack.length},'');paintSheet();$('#sheetBody').scrollTop=0;}
function paintSheet(){const top=stack[stack.length-1],w=$('#sheetWrap');
 if(!top){w.classList.remove('open');$('#sheetBody').innerHTML='';document.body.classList.remove('lock');renderTab();return;}
 w.classList.add('open');document.body.classList.add('lock');$('#sheet').classList.toggle('full',!!top.full);
 $('#sheetTitle').textContent=typeof top.title==='function'?top.title():(top.title||'');
 $('#sheetBody').innerHTML=top.render();if(top.mount)top.mount();}
const rerender=()=>paintSheet();

window.addEventListener('popstate',e=>{const depth=(e.state&&e.state.s)||0;let ch=false;while(stack.length>depth){const t=stack.pop();if(t.onClose)t.onClose();ch=true;}if(ch)paintSheet();});

function ring(pct,col,size,st){const r=(size-st)/2,c=2*Math.PI*r,p=Math.max(0,Math.min(1,pct||0)),h=size/2;
 return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" stroke="#262b35" stroke-width="${st}" fill="none"/><circle cx="${h}" cy="${h}" r="${r}" stroke="${col}" stroke-width="${st}" fill="none" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${h} ${h})"/></svg>`;}

function lineChart(cv,series,o={}){if(!cv)return;const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
 cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 const mu='#8b93a7',gr='#262b35',all=series.flatMap(s=>s.pts);x.font='11px -apple-system,system-ui,sans-serif';
 if(!all.length){x.fillStyle=mu;x.textAlign='center';x.font='14px -apple-system,system-ui,sans-serif';x.fillText(o.empty||'No data yet',W/2,H/2);return;}
 let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x)),y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));
 if(x0===x1){x0-=864e5*3;x1+=864e5*3;}if(y0===y1){const d=Math.abs(y0)*.05||1;y0-=d;y1+=d;}const py=(y1-y0)*.12;y0-=py;y1+=py;
 const L=44,R=12,T=10,B=24,cw=W-L-R,ch=H-T-B,X=v=>L+(v-x0)/(x1-x0)*cw,Y=v=>T+(1-(v-y0)/(y1-y0))*ch;
 const fa=v=>Math.abs(v)>=10000?r1(v/1000)+'k':Math.abs(v)>=100?Math.round(v):r1(v);
 x.lineWidth=1;x.strokeStyle=gr;x.fillStyle=mu;x.textAlign='right';x.textBaseline='middle';
 for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,yy=Y(v);x.beginPath();x.moveTo(L,yy);x.lineTo(W-R,yy);x.stroke();x.fillText(fa(v),L-6,yy);}
 x.textAlign='center';x.textBaseline='top';const n=Math.max(2,Math.min(4,Math.floor(cw/80)));
 for(let i=0;i<n;i++){const v=x0+(x1-x0)*i/(n-1);x.fillText(new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short'}),Math.min(Math.max(X(v),L+18),W-R-18),H-B+7);}
 for(const s of series){if(!s.pts.length)continue;const pts=[...s.pts].sort((a,b)=>a.x-b.x);x.strokeStyle=s.color;x.fillStyle=s.color;
  if(s.line!==false&&pts.length>1){x.lineWidth=s.width||2.5;x.lineJoin='round';x.lineCap='round';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p.x),Y(p.y)):x.moveTo(X(p.x),Y(p.y)));x.stroke();
   if(s.fill){x.lineTo(X(pts[pts.length-1].x),T+ch);x.lineTo(X(pts[0].x),T+ch);x.closePath();x.globalAlpha=.12;x.fill();x.globalAlpha=1;}}
  if(s.dots!==false){const rr=s.r||3;for(const p of pts){x.beginPath();x.arc(X(p.x),Y(p.y),rr,0,7);x.fill();}}}}

/* scanner */
const scan={tok:0,stream:null,timer:null,h5:null,busy:false};
let h5p=null;
function loadH5(){if(window.Html5Qrcode)return Promise.resolve();if(h5p)return h5p;
 h5p=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=res;s.onerror=()=>{h5p=null;s.remove();rej(new Error('Could not load the scanner library (offline?).'));};document.head.appendChild(s);});return h5p;}
function stopScanner(){scan.tok++;clearTimeout(scan.timer);if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop());scan.stream=null;}
 if(scan.h5){const h=scan.h5;scan.h5=null;h.stop().then(()=>{try{h.clear()}catch(e){}}).catch(()=>{});}}
function onScanned(code){if(scan.busy)return;scan.busy=true;stopScanner();if(navigator.vibrate)navigator.vibrate(60);
 Promise.resolve(lookupCode(code)).finally(()=>{scan.busy=false;});}
async function startScanner(){stopScanner();const tok=++scan.tok,box=$('#scanBox');if(!box)return;
 const fail=msg=>{if(tok===scan.tok&&$('#scanBox')){box.classList.remove('native');box.innerHTML=`<div class="msg">📷 ${esc(msg)}<br><br>You can type the barcode below instead.</div>`;}};
 if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return fail('Camera needs a secure (https://) page. Host the app as described in the instructions.');
 try{let native=false;
  if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();native=f.includes('ean_13');}catch(e){}}
  if(tok!==scan.tok)return;
  if(native){const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
   const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
   if(tok!==scan.tok){stream.getTracks().forEach(t=>t.stop());return;}
   scan.stream=stream;const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.srcObject=stream;box.innerHTML='';box.classList.add('native');box.appendChild(v);await v.play();
   const loop=async()=>{if(tok!==scan.tok)return;try{if(v.readyState>=2){const codes=await det.detect(v);const c=codes.find(x=>/^\d{8,14}$/.test(x.rawValue));if(c&&tok===scan.tok){onScanned(c.rawValue);return;}}}catch(e){}if(tok===scan.tok)scan.timer=setTimeout(loop,120);};loop();
  }else{box.innerHTML='<div class="msg">Loading scanner…</div>';await loadH5();if(tok!==scan.tok)return;
   box.innerHTML='<div id="h5reader"></div>';const F=window.Html5QrcodeSupportedFormats;
   const h5=new Html5Qrcode('h5reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
   await h5.start({facingMode:'environment'},{fps:12,qrbox:(w,hh)=>({width:Math.floor(Math.min(w*.85,340)),height:Math.floor(Math.min(hh*.45,170))})},txt=>{if(tok===scan.tok)onScanned(txt);},()=>{});
   if(tok!==scan.tok){h5.stop().then(()=>{try{h5.clear()}catch(e){}}).catch(()=>{});return;}scan.h5=h5;}
 }catch(e){fail(e&&e.name==='NotAllowedError'?'Camera permission was denied. Allow camera access for this site in your browser settings.':((e&&e.message)||'Camera not available.'));}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScanner();else if(topIs(renderAdd)&&S.addTab==='scan')startScanner();});

 const ws=D.body.filter(b=>b.weight).sort((a,b)=>a.date<b.date?-1:1),a1=avgW(addDays(today,-6),today),a0=avgW(addDays(today,-13),addDays(today,-7)),last=ws[ws.length-1];
 const dl=a1!=null&&a0!=null?toU(a1-a0):null;
 h+=`<div class="stats"><div class="stat"><span>Latest</span><b>${last?fmtW(last.weight):'–'} <small class="xs mu">${U()}</small></b><span>${last?fmtD(last.date,{day:'numeric',month:'short'}):'no entry'}</span></div><div class="stat"><span>7-day avg</span><b>${a1!=null?r1(toU(a1)):'–'}</b><span>${U()}</span></div><div class="stat"><span>vs prev. week</span><b class="${dl==null?'':Math.abs(dl)<=0.3?'ok':'warnTxt'}">${dl==null?'–':(dl>0?'+':'')+r1(dl)}</b><span>${U()} (avg)</span></div></div>`;
 const rng=S.bodyRange,from=rng==='all'?'0000':addDays(today,-(+rng));
 h+=`<div class="card"><div class="row between"><div class="h3">Weight</div><div class="seg" style="padding:3px">${[['30','30d'],['90','90d'],['365','1y'],['all','All']].map(([k,l])=>`<button style="min-height:34px;padding:5px 9px" class="${rng===k?'on':''}" data-a="bodyRange" data-v="${k}">${l}</button>`).join('')}</div></div><canvas class="chart" id="cvW"></canvas><div class="legend"><span><i style="background:#8b93a7"></i>Daily</span><span><i style="background:#3ddc97"></i>7-day moving average</span></div></div>`;
 const inR=ws.filter(b=>b.date>=from),ma=inR.map(b=>{const a=avgW(addDays(b.date,-6),b.date);return{x:parseYmd(b.date).getTime(),y:toU(a)};});
 S.post.push(()=>lineChart($('#cvW'),[{pts:inR.map(b=>({x:parseYmd(b.date).getTime(),y:toU(b.weight)})),color:'#8b93a7',line:false,r:3},{pts:ma,color:'#3ddc97',dots:false,width:3}],{empty:'Log your weight to see the chart'}));
 const wa=D.body.filter(b=>b.waist&&b.date>=from).sort((a,b)=>a.date<b.date?-1:1);
 if(wa.length){h+=`<div class="card"><div class="h3">Waist (cm)</div><canvas class="chart" id="cvWaist" style="height:170px"></canvas></div>`;S.post.push(()=>lineChart($('#cvWaist'),[{pts:wa.map(b=>({x:parseYmd(b.date).getTime(),y:b.waist})),color:'#f5b942'}]));}
 const hist=[...D.body].sort((a,b)=>a.date<b.date?1:-1).slice(0,60);

function bodySave(){const date=$('#bDate').value||ymd(),wv=num($('#bW').value),waist=num($('#bWaist').value),notes=$('#bNotes').value.trim();

function renderProgress(){let h=`<div class="seg mt8">${[['ex','Exercises'],['cal','Calendar'],['week','Weekly']].map(([k,l])=>`<button class="${S.pgSeg===k?'on':''}" data-a="pgSeg" data-v="${k}">${l}</button>`).join('')}</div>`;
 return h+(S.pgSeg==='ex'?pgExercises():S.pgSeg==='cal'?pgCalendar():pgWeekly());}
function pgExercises(){const last=new Map();for(const s of D.sets){const l=last.get(s.exId);if(!l||l<s.date)last.set(s.exId,s.date);}
 const exs=D.exercises.filter(e=>last.has(e.id)).sort((a,b)=>last.get(b.id).localeCompare(last.get(a.id)));
 if(!exs.length)return'<div class="card center mu pad">Log some sets in the Workout tab – charts and personal records will appear here.</div>';
 if(!S.pgEx||!last.has(S.pgEx)||!exById(S.pgEx))S.pgEx=exs[0].id;
 const ex=exById(S.pgEx),sec=ex.unit==='sec',bw=ex.equip==='bw',by=new Map();
 for(const s of D.sets)if(s.exId===ex.id){if(!by.has(s.date))by.set(s.date,[]);by.get(s.date).push(s);}
 const rows=[...by.keys()].sort().map(d=>{const ss=by.get(d).sort((a,b)=>a.ts-b.ts);return{d,ss,heavy:topSet(ss),e1:Math.max(...ss.map(s=>score(ex,s))),vol:ss.reduce((a,s)=>a+s.weight*s.reps,0),reps:ss.reduce((a,s)=>a+s.reps,0),maxR:Math.max(...ss.map(s=>s.reps))};});
 const noW=bw&&!rows.some(r=>r.heavy.weight>0);
 const metrics=sec?[['hold','Best hold'],['time','Total time']]:noW?[['reps','Best set (reps)'],['treps','Total reps']]:[['e1rm','Est. 1RM'],['best','Best set'],['vol','Volume']];
 if(!metrics.some(m=>m[0]===S.pgMetric))S.pgMetric=metrics[0][0];
 const val=r=>({hold:r.maxR,time:r.reps,reps:r.maxR,treps:r.reps,e1rm:toU(r.e1),best:toU(r.heavy.weight),vol:toU(r.vol)})[S.pgMetric];
 const unitLbl={hold:'s',time:'s',reps:'reps',treps:'reps',e1rm:U(),best:U(),vol:U()+' × reps'}[S.pgMetric];
 let h=`<select class="mt" data-c="pgEx">${exs.map(e=>`<option value="${esc(e.id)}" ${e.id===ex.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`;
 h+=`<div class="card"><div class="seg">${metrics.map(([k,l])=>`<button class="${S.pgMetric===k?'on':''}" data-a="pgMetric" data-v="${k}">${l}</button>`).join('')}</div><canvas class="chart" id="cvEx"></canvas><div class="xs mu mt4">${{e1rm:`Estimated 1-rep max (Epley) of your best set each session${bw?', incl. body weight':''}.`,best:'Heaviest set weight each session.',vol:`Total volume = Σ weight × reps${ex.equip==='db2'?' (weight per dumbbell)':''}.`,hold:'Longest hold per session.',time:'Total seconds per session.',reps:'Most reps in a set per session.',treps:'Total reps per session.'}[S.pgMetric]} Unit: ${unitLbl}.</div></div>`;
 S.post.push(()=>lineChart($('#cvEx'),[{pts:rows.map(r=>({x:parseYmd(r.d).getTime(),y:val(r)})),color:'#3ddc97',fill:true}]));
 let heavy=null,heavyD,mostR=null,mostRD,bestE=0,bestED,bestV=0,bestVD;
 for(const r of rows){for(const s of r.ss){if(!heavy||s.weight>heavy.weight||(s.weight===heavy.weight&&s.reps>heavy.reps)){heavy=s;heavyD=r.d;}if(!mostR||s.reps>mostR.reps||(s.reps===mostR.reps&&s.weight>mostR.weight)){mostR=s;mostRD=r.d;}}
  if(r.e1>bestE){bestE=r.e1;bestED=r.d;}if(r.vol>bestV){bestV=r.vol;bestVD=r.d;}}
 const dd=d=>d?fmtD(d,{day:'numeric',month:'short',year:'2-digit'}):'';
 const tiles=sec?[['Longest hold',`${mostR.reps} s`,mostRD],['Sessions',rows.length,'']]
  :[['Heaviest set',fmtSet(ex,heavy,true),heavyD],['Best est. 1RM',`${r1(toU(bestE))} ${U()}`,bestED],['Most reps',fmtSet(ex,mostR,true),mostRD],['Best volume',noW?`${Math.max(...rows.map(r=>r.reps))} reps`:`${fmtNum(toU(bestV))} ${U()}`,noW?'':bestVD]];
 h+=`<div class="lbl mt">🏆 Personal records</div><div class="stats two">${tiles.map(([l,v,d])=>`<div class="stat"><span>${l}</span><b>${v}</b><span>${dd(d)}</span></div>`).join('')}</div>`;
 h+=`<div class="card"><div class="h3">Recent sessions</div>${rows.slice(-8).reverse().map(r=>`<div class="li sm" style="padding:9px 0"><div class="grow"><div class="nm">${fmtD(r.d)}</div><div class="xs mu">${r.ss.map(s=>fmtSet(ex,s)).join(' · ')}</div></div>${sec?'':`<div class="xs mu right">1RM≈${r1(toU(r.e1))}</div>`}</div>`).join('')}</div>`;

function pgCalendar(){const today=ymd();if(!S.calM)S.calM=today.slice(0,8)+'01';const first=parseYmd(S.calM),y=first.getFullYear(),mo=first.getMonth(),nd=new Date(y,mo+1,0).getDate(),off=(first.getDay()+6)%7;
 const wds=workoutDates();if(!S.calSel)S.calSel=wds.length?wds[wds.length-1]:today;

function pgWeekly(){const st=D.settings,today=ymd(),wds=workoutDates();let h='';
 for(let i=0;i<8;i++){const ws=addDays(weekStart(today),-7*i),we=addDays(ws,6),n=wds.filter(d=>d>=ws&&d<=we).length;
  const fdays=[...new Set(D.foods.filter(f=>f.date>=ws&&f.date<=we).map(f=>f.date))];let k=0,p=0;for(const d of fdays){const t=sumT(dayFood(d));k+=t.kcal;p+=t.p;}
  const ak=fdays.length?k/fdays.length:null,ap=fdays.length?p/fdays.length:null,wa=avgW(ws,we),pw=avgW(addDays(ws,-7),addDays(ws,-1)),dl=wa!=null&&pw!=null?toU(wa-pw):null;
  const title=i===0?'This week':i===1?'Last week':`${fmtD(ws,{day:'numeric',month:'short'})} – ${fmtD(we,{day:'numeric',month:'short'})}`;
  const kc=ak==null?'':(ak>=st.kcal-150&&ak<=st.kcalMax)?'ok':'warnTxt',pc=ap==null?'':ap>=st.protein*.9?'ok':'warnTxt';
  h+=`<div class="card"><div class="row between"><div><b>${title}</b><div class="xs mu">${fmtD(ws,{day:'numeric',month:'short'})} – ${fmtD(we,{day:'numeric',month:'short'})}</div></div><span class="badge" style="${n>=st.perWeek?'':'background:var(--s2);color:var(--mu)'}">${n} / ${st.perWeek} workouts</span></div>
  <div class="wkgrid"><div><span>Ø calories</span><b class="${kc}">${ak==null?'–':r0(ak)}</b></div><div><span>Ø protein</span><b class="${pc}">${ap==null?'–':r0(ap)+' g'}</b></div><div><span>Ø weight</span><b>${wa==null?'–':r1(toU(wa))}</b> ${dl==null?'':`<small class="${Math.abs(dl)<=.3?'ok':'warnTxt'}">${dl>0?'+':''}${r1(dl)}</small>`}</div></div>
  <div class="xs mu mt8">${fdays.length} day${fdays.length===1?'':'s'} of food logged${ak!=null?` · target ${st.kcal} kcal / ${st.protein} g P`:''}</div></div>`;}

 h+=`<div class="lbl mt">Training split</div><div class="card inset">${fld('perWeek','Sessions per week','numeric')}<div class="xs mu mt8">The app rotates through the days below in order and suggests the next one.</div></div>`;
 D.split.forEach((d,i)=>{h+=`<div class="card inset" style="border-left:4px solid ${d.color}"><input data-c="dayName" data-i="${i}" value="${esc(d.name)}" style="font-weight:700">`+d.exIds.map((id,j)=>{const ex=exById(id);return ex?`<div class="li sm"><span class="grow sm">${esc(ex.name)}</span><button class="iconbtn sm" data-a="spMv" data-i="${i}" data-j="${j}" data-d="-1" ${j===0?'disabled':''}>↑</button><button class="iconbtn sm" data-a="spMv" data-i="${i}" data-j="${j}" data-d="1" ${j===d.exIds.length-1?'disabled':''}>↓</button><button class="iconbtn sm" data-a="spRm" data-i="${i}" data-j="${j}">✕</button></div>`:'';}).join('')+
  `<select data-c="spAdd" data-i="${i}" class="mt8"><option value="">＋ Add exercise to this day…</option>${D.exercises.filter(e=>!d.exIds.includes(e.id)).map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select>${D.split.length>1?`<button class="btn sm dan mt8" data-a="spDelDay" data-i="${i}">Delete this day</button>`:''}</div>`;});
 h+=`<div class="grid2 mt8"><button class="btn" data-a="spAddDay">＋ Add day</button><button class="btn" data-a="manageEx">Manage exercises</button></div>`;
 const kb=r1((localStorage.getItem(KEY)||'').length/1024);
 h+=`<div class="lbl mt">Backup & sync</div><div class="card inset"><div class="grid2"><button class="btn" data-a="exportDl">⬇ Export JSON</button>${navigator.canShare?'<button class="btn" data-a="exportShare">↗ Share backup</button>':''}<button class="btn" data-a="importData" data-v="merge">⬆ Import (merge)</button><button class="btn" data-a="importData" data-v="replace">⬆ Import (replace)</button></div>
 <div class="xs mu mt8"><b>Merge</b> adds everything from the backup that this device doesn't have yet – use it to sync two phones. <b>Replace</b> overwrites all data here.</div><div class="xs mu mt8">On this device: ${kb} KB · ${D.sets.length} sets · ${D.foods.length} food entries · ${D.body.length} weigh-ins</div></div>`;
 h+=`<button class="btn dan full mt" data-a="reset">Reset all data</button><div class="xs mu center pad">Recomp Tracker · all data stays on this device · food data from Open Food Facts (ODbL)</div>`;
 return h;}
function renderManage(){const by={};for(const e of D.exercises)(by[e.muscle]=by[e.muscle]||[]).push(e);
 return'<button class="btn pri full" data-a="newEx">＋ New exercise</button>'+Object.keys(by).sort().map(m=>`<div class="lbl mt">${esc(m)}</div>`+by[m].map(e=>`<div class="li" data-a="editEx" data-id="${esc(e.id)}"><div class="grow"><div class="nm">${esc(e.name)}</div><div class="xs mu">${eqOf(e).label}</div></div><span class="chev">›</span></div>`).join('')).join('');}
const backupBlob=()=>new Blob([JSON.stringify({app:'recomp-tracker',version:1,exportedAt:new Date().toISOString(),data:D})],{type:'application/json'});
const backupName=()=>`recomp-backup-${ymd()}.json`;
function exportDl(){const a=document.createElement('a');a.href=URL.createObjectURL(backupBlob());a.download=backupName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('Backup exported');}
async function exportShare(){const f=new File([backupBlob()],backupName(),{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Recomp backup'});}catch(e){}}else exportDl();}
function mergeData(o){for(const k of['sets','cardio','foods','exercises']){const ids=new Set(D[k].map(x=>x.id));for(const x of o[k])if(x&&!ids.has(x.id))D[k].push(x);}
 const bIds=new Set(D.body.map(x=>x.id)),bDates=new Set(D.body.map(x=>x.date));for(const x of o.body)if(x&&!bIds.has(x.id)&&!bDates.has(x.date))D.body.push(x);
 for(const k of['favs','myFoods','recent']){const ks=new Set(D[k].map(x=>x.key));for(const x of o[k])if(x&&!ks.has(x.key))D[k].push(x);}
 for(const d of o.split)if(!D.split.some(x=>x.id===d.id))D.split.push(d);}
async function doImport(file){try{let o=JSON.parse(await file.text());if(o&&o.data)o=o.data;
  if(!o||!Array.isArray(o.sets)||!Array.isArray(o.foods)||!Array.isArray(o.exercises))throw new Error('This is not a Recomp backup file.');
  o=migrate(o);
  if(S.importMode==='replace'){if(!confirm('Replace ALL data on this device with this backup?'))return;D=o;}
  else mergeData(o);
  save();toast('Import complete ✓');paintSheet();}catch(e){alert('Import failed: '+e.message);}}

 wkSeg:el=>{S.wkSeg=el.dataset.v;renderTab();},
 logToday:()=>{S.logDate=ymd();S.wkSeg=null;renderTab();},
 openEx:el=>openEx(el.dataset.id),

 newCardio:()=>openCardio(null),editCardio:el=>openCardio(el.dataset.id),
 cdType:el=>{readCd();S.cd.type=el.dataset.v;rerender();},cdInt:el=>{readCd();S.cd.int=el.dataset.v;rerender();},
 cdStep:el=>{readCd();S.cd.min=Math.max(0,(S.cd.min||0)+Number(el.dataset.d));$('#cdMin').value=S.cd.min;$('#cdEst').innerHTML=cdEstHtml();},
 cdSave:()=>cdSave(),cdDel:()=>{if(!confirm('Delete this cardio entry?'))return;D.cardio=D.cardio.filter(x=>x.id!==S.cd.id);save();closeSheet();},
 nutDay:el=>{const n=addDays(S.nutDate,+el.dataset.d);if(n<=ymd()){S.nutDate=n;renderTab();}},nutToday:()=>{S.nutDate=ymd();renderTab();},
 addFood:el=>openAdd(el.dataset.tab||(D.recent.length?'recent':'search'),el.dataset.meal),
 addTab:el=>{if(S.addTab==='manual')readMan();S.addTab=el.dataset.v;rerender();},
 pickMeal:el=>{S.meal=el.dataset.v;document.querySelectorAll('.mealchip').forEach(b=>b.classList.toggle('on',b.dataset.v===S.meal));},
 codeGo:()=>{const v=$('#codeIn').value;stopScanner();lookupCode(v);},
 searchGo:()=>doSearch(),
 openItem:el=>{const it=TMP[+el.dataset.i];if(it)openProduct(it,{meal:S.meal});},
 manMode:el=>{readMan();S.man.mode=el.dataset.v;rerender();},manSave:()=>manSave(),
 prStep:el=>{const i=$('#prAmt');const v=Math.max(0,r2((num(i.value)||0)+Number(el.dataset.d)));i.value=v;S.pr.amount=v;updPr();},
 prSet:el=>{const v=Number(el.dataset.v);$('#prAmt').value=v;S.pr.amount=v;updPr();},
 prMeal:el=>{S.pr.meal=el.dataset.v;document.querySelectorAll('.prmeal').forEach(b=>b.classList.toggle('on',b.dataset.v===S.pr.meal));if(!S.pr.entryId)$('#prSaveBtn').textContent='Add to '+mealName(S.pr.meal);},
 prFav:el=>{const it=S.pr.item;if(isFav(it.key)){D.favs=D.favs.filter(x=>x.key!==it.key);toast('Removed from favorites');}else{D.favs.unshift(JSON.parse(JSON.stringify(it)));toast('Added to favorites ★');}save();const f=isFav(it.key);el.textContent=f?'★':'☆';el.classList.toggle('on',f);},
 prSave:()=>prSave(),prDel:()=>{if(!confirm('Delete this entry?'))return;D.foods=D.foods.filter(x=>x.id!==S.pr.entryId);save();toast('Deleted');closeAll();},
 editEntry:el=>{const e=D.foods.find(x=>x.id===el.dataset.id);if(e)openProduct(e.item,{entry:e});},
 bodySave:()=>bodySave(),bodyEdit:el=>{S.bodyEdit=el.dataset.id;renderTab();window.scrollTo({top:0,behavior:'smooth'});},
 bodyCancel:()=>{S.bodyEdit=null;renderTab();},
 bodyDel:el=>{if(!confirm('Delete this entry?'))return;D.body=D.body.filter(b=>b.id!==el.dataset.id);S.bodyEdit=null;save();renderTab();},
 bodyRange:el=>{S.bodyRange=el.dataset.v;renderTab();},
 pgSeg:el=>{S.pgSeg=el.dataset.v;renderTab();},pgMetric:el=>{S.pgMetric=el.dataset.v;renderTab();},
 calNav:el=>{const d=parseYmd(S.calM);d.setMonth(d.getMonth()+Number(el.dataset.d));S.calM=ymd(d);renderTab();},
 calDay:el=>{S.calSel=el.dataset.d;renderTab();},
 calOpen:el=>{const d=el.dataset.d;S.logDate=d>ymd()?ymd():d;S.wkSeg=null;S.tab='workout';renderTab();window.scrollTo(0,0);},

 unit:el=>{D.settings.unit=el.dataset.v;save();rerender();},
 exportDl:()=>exportDl(),exportShare:()=>exportShare(),
 importData:el=>{S.importMode=el.dataset.v;const f=$('#fileIn');f.value='';f.click();},

 spMv:el=>{const d=D.split[+el.dataset.i],j=+el.dataset.j,k=j+Number(el.dataset.d);if(!d||k<0||k>=d.exIds.length)return;[d.exIds[j],d.exIds[k]]=[d.exIds[k],d.exIds[j]];save();rerender();},

function makeIcon(sz){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');x.fillStyle='#0d0f13';x.fillRect(0,0,sz,sz);
 const g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#3ddc97');g.addColorStop(1,'#2bb3c9');x.fillStyle=g;const s=sz/100;
 const rr=(X,Y,w,h,r)=>{x.beginPath();if(x.roundRect)x.roundRect(X*s,Y*s,w*s,h*s,r*s);else x.rect(X*s,Y*s,w*s,h*s);x.fill();};
 rr(24,46,52,8,3);rr(20,31,10,38,4);rr(70,31,10,38,4);rr(12,38,8,24,3);rr(80,38,8,24,3);return c.toDataURL('image/png');}

  icons:[{src:makeIcon(192),sizes:'192x192',type:'image/png'},{src:makeIcon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
 $('#manifestLink').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man));
 $('#appleIcon').href=makeIcon(180);}catch(e){}
